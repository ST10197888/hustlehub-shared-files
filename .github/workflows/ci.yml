
name: HustleHub CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-tests:
    name: Backend Automated Tests
    runs-on: ubuntu-22.04

    services:
      mongodb:
        image: mongo:8
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.adminCommand(\"ping\")'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: .

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: hustlehub-backend/package-lock.json

      - name: Install backend dependencies
        run: npm ci --prefix hustlehub-backend

      - name: Run backend ESLint
        run: npm run lint --prefix hustlehub-backend

      - name: Run backend tests
        run: npm test --prefix hustlehub-backend
        env:
          MONGODB_TEST_URI: mongodb://127.0.0.1:27017/hustlehub_test
          JWT_SECRET: ${{ secrets.CI_JWT_SECRET }}

  frontend-checks:
    name: Frontend Automated Tests and Build
    runs-on: ubuntu-22.04

    defaults:
      run:
        working-directory: Frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Run frontend tests
        run: npm test

      - name: Run ESLint
        run: npm run lint

      - name: Build frontend application
        run: npm run build
  newman-api-tests:
    name: Newman API Integration Tests
    runs-on: ubuntu-22.04

    services:
      mongodb:
        image: mongo:8
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.adminCommand(\"ping\")'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            hustlehub-backend/package-lock.json

      - name: Install root dependencies
        run: npm ci

      - name: Install backend dependencies
        run: npm ci --prefix hustlehub-backend

      - name: Start backend server
        run: |
          nohup npm start --prefix hustlehub-backend > /tmp/hustlehub-backend.log 2>&1 &
        env:
          NODE_ENV: test
          PORT: 5000
          MONGODB_URI: mongodb://127.0.0.1:27017/hustlehub_test
          JWT_SECRET: ${{ secrets.CI_JWT_SECRET }}
          AUTH_RATE_LIMIT: 100

      - name: Wait for backend readiness
        run: |
          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:5000/health/ready; then
              echo "Backend is ready."
              exit 0
            fi
            sleep 2
          done

          echo "Backend failed to become ready."
          cat /tmp/hustlehub-backend.log
          exit 1

      - name: Run Newman API tests
        run: |
          npx newman run postman/MERN-Marketplace.postman_collection.json \
            --env-var "baseUrl=http://127.0.0.1:5000" \
            --env-var "jwtSecret=$JWT_SECRET" \
            --reporters cli
        env:
          JWT_SECRET: ${{ secrets.CI_JWT_SECRET }}

  docker-build:
    name: Build Backend and Frontend Docker Images
    runs-on: ubuntu-22.04
    needs:
      - backend-tests
      - frontend-checks
      - newman-api-tests

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build backend Docker image
        run: |
          docker build \
            --tag hustlehub-backend:ci \
            ./hustlehub-backend

      - name: Build frontend Docker image
        run: |
          docker build \
            --tag hustlehub-frontend:ci \
            ./Frontend
